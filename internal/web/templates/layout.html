{{define "layout" -}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Curu{{end}}</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; }
    header, main { margin: auto; max-width: 48rem; padding: 1rem; }
    header { border-bottom: 1px solid currentColor; }
    nav a { color: inherit; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <header><nav aria-label="Primary"><a href="/">Curu</a></nav></header>
  <main>{{block "content" .}}{{end}}</main>
</body>
</html>
{{- end}}
