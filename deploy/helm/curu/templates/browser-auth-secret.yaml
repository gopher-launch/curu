{{- if and .Values.edge.enabled (eq .Values.browserAuth.sessionSecret.existingName "") -}}
{{- $name := include "curu.browserAuthSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $cookieSecret := randBytes 32 -}}
{{- if $existing -}}
{{- $cookieSecret = index $existing.data .Values.browserAuth.sessionSecret.key -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "curu.labels" . | nindent 4 }}
    app.kubernetes.io/component: browser-authentication
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.browserAuth.sessionSecret.key }}: {{ $cookieSecret | quote }}
{{- end }}
