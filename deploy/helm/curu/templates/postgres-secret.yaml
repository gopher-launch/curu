{{- if and .Values.database.bundled.enabled (eq .Values.database.bundled.credentialsSecret.existingName "") -}}
{{- $name := include "curu.postgresSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $admin := randAlphaNum 40 -}}
{{- $migration := randAlphaNum 40 -}}
{{- $initializer := randAlphaNum 40 -}}
{{- $runtime := randAlphaNum 40 -}}
{{- $keycloak := randAlphaNum 40 -}}
{{- if $existing -}}
{{- $admin = index $existing.data "admin-password" | b64dec -}}
{{- $migration = index $existing.data "migration-password" | b64dec -}}
{{- $initializer = index $existing.data "initializer-password" | b64dec -}}
{{- $runtime = index $existing.data "runtime-password" | b64dec -}}
{{- $keycloak = index $existing.data "keycloak-password" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "curu.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-password: {{ $admin | quote }}
  migration-password: {{ $migration | quote }}
  initializer-password: {{ $initializer | quote }}
  runtime-password: {{ $runtime | quote }}
  keycloak-password: {{ $keycloak | quote }}
  admin-url: {{ printf "postgres://postgres:%s@%s:%d/postgres?sslmode=disable" $admin (include "curu.postgresName" .) (.Values.database.bundled.service.port | int) | quote }}
  migration-url: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" .Values.database.bundled.names.migrationRole $migration (include "curu.postgresName" .) (.Values.database.bundled.service.port | int) .Values.database.bundled.names.curuDatabase | quote }}
  initializer-url: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" .Values.database.bundled.names.initializerRole $initializer (include "curu.postgresName" .) (.Values.database.bundled.service.port | int) .Values.database.bundled.names.curuDatabase | quote }}
  runtime-url: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" .Values.database.bundled.names.runtimeRole $runtime (include "curu.postgresName" .) (.Values.database.bundled.service.port | int) .Values.database.bundled.names.curuDatabase | quote }}
  keycloak-url: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" .Values.database.bundled.names.keycloakRole $keycloak (include "curu.postgresName" .) (.Values.database.bundled.service.port | int) .Values.database.bundled.names.keycloakDatabase | quote }}
{{- end }}
