{{- if .Values.identity.bundled.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curu.keycloakName" . }}
  labels:
    {{- include "curu.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "curu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: identity
  template:
    metadata:
      labels:
        {{- include "curu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: identity
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: {{ include "curu.keycloakImage" . | quote }}
          imagePullPolicy: {{ .Values.identity.bundled.image.pullPolicy }}
          args:
            - start
            - --http-enabled=true
            - --hostname={{ .Values.identity.bundled.hostname }}
            - --hostname-strict=true
            - --proxy-headers=xforwarded
          securityContext:
            allowPrivilegeEscalation: false
            # The reviewed upstream image performs its first production build
            # augmentation on `start`; a custom pre-built image is not owned here.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "curu.keycloakDatabaseSecret" . | quote }}
                  key: {{ include "curu.keycloakDatabaseSecretKey" . | quote }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "curu.keycloakSecretName" . | quote }}
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "curu.keycloakSecretName" . | quote }}
                  key: admin-password
            {{- if and .Values.database.external.enabled (ne .Values.database.external.tls.caSecret.name "") }}
            - name: KC_TRUSTSTORE_PATHS
              value: /etc/curu/database/ca.crt
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /realms/master
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /realms/master
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.identity.bundled.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.database.external.enabled (ne .Values.database.external.tls.caSecret.name "") }}
            - name: database-ca
              mountPath: /etc/curu/database
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if and .Values.database.external.enabled (ne .Values.database.external.tls.caSecret.name "") }}
        - name: database-ca
          secret:
            secretName: {{ .Values.database.external.tls.caSecret.name | quote }}
            items:
              - key: {{ .Values.database.external.tls.caSecret.key | quote }}
                path: ca.crt
        {{- end }}
{{- end }}
