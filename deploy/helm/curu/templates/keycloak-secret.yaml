{{- if and .Values.identity.bundled.enabled (eq .Values.identity.bundled.credentialsSecret.existingName "") -}}
{{- $name := include "curu.keycloakSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $adminPassword := randAlphaNum 40 -}}
{{- $clientSecret := randAlphaNum 48 -}}
{{- $ownerPassword := randAlphaNum 32 -}}
{{- $otherPassword := randAlphaNum 32 -}}
{{- if $existing -}}
{{- $adminPassword = index $existing.data "admin-password" | b64dec -}}
{{- $clientSecret = index $existing.data "client-secret" | b64dec -}}
{{- $ownerPassword = index $existing.data "owner-password" | b64dec -}}
{{- $otherPassword = index $existing.data "other-password" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "curu.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-username: curu-bootstrap-admin
  admin-password: {{ $adminPassword | quote }}
  client-secret: {{ $clientSecret | quote }}
  owner-password: {{ $ownerPassword | quote }}
  other-password: {{ $otherPassword | quote }}
{{- end }}
