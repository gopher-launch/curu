{{- if .Values.runtime.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curu.fullname" . }}
  labels:
    {{- include "curu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "curu.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        {{- include "curu.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: curu
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: {{ include "curu.fullname" . }}-runtime
          env:
            - name: CURU_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "curu.runtimeSecret" . | quote }}
                  key: {{ include "curu.runtimeSecretKey" . | quote }}
            - name: SSL_CERT_FILE
              value: /etc/curu/identity/ca.crt
            {{- if and .Values.database.external.enabled (ne .Values.database.external.tls.caSecret.name "") }}
            - name: PGSSLROOTCERT
              value: /etc/curu/database/ca.crt
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: identity-ca
              mountPath: /etc/curu/identity
              readOnly: true
          {{- if and .Values.database.external.enabled (ne .Values.database.external.tls.caSecret.name "") }}
            - name: database-ca
              mountPath: /etc/curu/database
              readOnly: true
          {{- end }}
      volumes:
        - name: identity-ca
          configMap:
            name: {{ .Values.identity.caTrust.configMapName | quote }}
            items:
              - key: {{ .Values.identity.caTrust.key | quote }}
                path: ca.crt
      {{- if and .Values.database.external.enabled (ne .Values.database.external.tls.caSecret.name "") }}
        - name: database-ca
          secret:
            secretName: {{ .Values.database.external.tls.caSecret.name | quote }}
            items:
              - key: {{ .Values.database.external.tls.caSecret.key | quote }}
                path: ca.crt
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
