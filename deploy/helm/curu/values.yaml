# Curu image inputs are deliberately explicit and have no floating defaults.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

service:
  port: 8080

runtime:
  enabled: true
  publicOrigin: ""
  trustedProxyCIDRs: ""
  loginURL: ""
  logoutURL: ""
  shutdownTimeout: 10s
  readHeaderTimeout: 5s
  idleTimeout: 60s

trust:
  profile: rfc9068
  issuer: ""
  audience: ""
  jwksURL: ""
  algorithms:
    - RS256
  clockSkew: 60s
  maxLifetime: 15m
  jwksFetchTimeout: 5s
  jwksDefaultCacheTTL: 5m
  jwksUnknownKIDRefreshInterval: 1m

owner:
  issuer: ""
  subject: ""
  id: ""

dataLifecycle:
  migrate: false
  initialize: none
  activeDeadlineSeconds: 300
  backoffLimit: 0

database:
  bundled:
    enabled: true
    image:
      repository: postgres
      tag: 17.6-bookworm
      digest: sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
      pullPolicy: IfNotPresent
    credentialsSecret:
      existingName: ""
    names:
      curuDatabase: curu
      keycloakDatabase: keycloak
      migrationRole: curu_migration
      initializerRole: curu_initializer
      runtimeRole: curu_runtime
      keycloakRole: keycloak
    service:
      # Fixed to the pinned image's PostgreSQL server port.
      port: 5432
    storage:
      storageClassName: curu-local-retained
      size: 20Gi
      selectorLabels:
        curu.local/storage: retained
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  external:
    enabled: false
    host: ""
    port: 5432
    curuDatabase: ""
    keycloakDatabase: ""
    initializerRole: curu_initializer
    runtimeRole: curu_runtime
    tls:
      mode: verify-full
      caSecret:
        name: ""
        key: ca.crt
    administrationSecret:
      name: ""
      key: database-url
    migrationSecret:
      name: ""
      key: database-url
    initializerSecret:
      name: ""
      key: database-url
    runtimeSecret:
      name: ""
      key: database-url
    keycloakSecret:
      name: ""
      key: database-url

identity:
  bundled:
    enabled: true
  external:
    enabled: false

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
