# Curu image inputs are deliberately explicit and have no floating defaults.
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

service:
  port: 8080

edge:
  enabled: true
  applicationHost: curu.test
  identityHost: identity.curu.test
  publicOrigin: https://curu.test:8443
  publicPort: 8443
  tlsSecretName: curu-local-edge-tls
  image:
    repository: nginx
    tag: 1.29.2-alpine
    digest: sha256:b03ccb7431a2e3172f5cbae96d82bd792935f33ecb88fbf2940559e475745c4e
    pullPolicy: IfNotPresent
  service:
    port: 8443
    nodePort: 30443
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

browserAuth:
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.5
    digest: sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    pullPolicy: IfNotPresent
  sessionSecret:
    existingName: ""
    key: cookie-secret
  cookie:
    name: __Host-curu_session
    expire: 8h
    refresh: 5m
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

runtime:
  enabled: true
  publicOrigin: ""
  trustedProxyCIDRs: 10.244.0.0/16
  loginURL: https://curu.test:8443/oauth2/start?rd=https%3A%2F%2Fcuru.test%3A8443%2Factivities
  logoutURL: https://curu.test:8443/oauth2/sign_out?rd=https%3A%2F%2Fcuru.test%3A8443%2F
  shutdownTimeout: 10s
  readHeaderTimeout: 5s
  idleTimeout: 60s

trust:
  profile: rfc9068
  issuer: ""
  audience: ""
  jwksURL: ""
  algorithms:
    - RS256
  clockSkew: 60s
  maxLifetime: 15m
  jwksFetchTimeout: 5s
  jwksDefaultCacheTTL: 5m
  jwksUnknownKIDRefreshInterval: 1m

owner:
  issuer: ""
  subject: ""
  id: ""

dataLifecycle:
  migrate: false
  initialize: none
  activeDeadlineSeconds: 300
  backoffLimit: 0

database:
  bundled:
    enabled: true
    image:
      repository: postgres
      tag: 17.6-bookworm
      digest: sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
      pullPolicy: IfNotPresent
    credentialsSecret:
      existingName: ""
    names:
      curuDatabase: curu
      keycloakDatabase: keycloak
      migrationRole: curu_migration
      initializerRole: curu_initializer
      runtimeRole: curu_runtime
      keycloakRole: keycloak
    service:
      # Fixed to the pinned image's PostgreSQL server port.
      port: 5432
    storage:
      storageClassName: curu-local-retained
      size: 20Gi
      selectorLabels:
        curu.local/storage: retained
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  external:
    enabled: false
    host: ""
    port: 5432
    curuDatabase: ""
    keycloakDatabase: ""
    initializerRole: curu_initializer
    runtimeRole: curu_runtime
    tls:
      mode: verify-full
      caSecret:
        name: ""
        key: ca.crt
    administrationSecret:
      name: ""
      key: database-url
    migrationSecret:
      name: ""
      key: database-url
    initializerSecret:
      name: ""
      key: database-url
    runtimeSecret:
      name: ""
      key: database-url
    keycloakSecret:
      name: ""
      key: database-url

identity:
  bundled:
    enabled: true
    image:
      repository: quay.io/keycloak/keycloak
      tag: 26.8.2
      digest: sha256:4340d05ee7d15be34293868d495ac772d61f1a4d0e43d53bae2e75e2f05de185
      pullPolicy: IfNotPresent
    hostname: https://identity.curu.test:8443
    realm: curu
    audience: curu
    client:
      id: curu-browser
      redirectURIs:
        - https://curu.test:8443/oauth2/callback
      webOrigins:
        - https://curu.test:8443
    accessTokenLifespanSeconds: 600
    tokenFixture:
      enabled: false
    credentialsSecret:
      existingName: ""
    users:
      owner:
        subject: 00000000-0000-4000-8000-000000000001
        username: owner
      other:
        subject: 00000000-0000-4000-8000-000000000002
        username: other-user
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
  external:
    enabled: false
    client:
      id: ""
      secret:
        name: ""
        key: client-secret
  caTrust:
    configMapName: curu-local-ca
    key: ca.crt

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
